[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msg-str"
version = "1.0.0"
description = "Modular research code for graph-augmented passive stroke-risk surveillance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
topic = [
  "torch>=2.1",
  "sentence-transformers>=2.2",
  "bertopic>=0.16",
  "umap-learn>=0.5",
  "hdbscan>=0.8",
]
llm = ["google-genai>=1.0"]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
